<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>バス停暗記</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#111;color:#fff;touch-action:manipulation}
#app{height:100dvh;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom))}
header{text-align:center;font-size:14px;opacity:.6;padding:5px 0 10px}
#route{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.slot{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #444;border-radius:16px;background:#1b1b1b;padding:8px 12px;font-size:clamp(23px,6vw,34px);font-weight:700;line-height:1.25}
.slot.next{border:2px solid #888;background:#292929;font-size:clamp(28px,7.5vw,44px);font-weight:800}
.slot.empty{opacity:0;border-color:transparent;background:transparent}
footer{flex:none;display:flex;justify-content:center;gap:8px;padding-top:10px;z-index:3}
button{border:0;border-radius:11px;padding:9px 15px;font-size:14px;background:#333;color:#fff}
#tap{position:fixed;inset:0;z-index:0}
#app>*{position:relative;z-index:1}
#done{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:34px;font-weight:800}
#done small{display:block;font-size:15px;opacity:.6;font-weight:400;margin-top:10px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="tap"></div>
<div id="app">
<header id="progress"></header>
<div id="route">
<div class="slot" id="slot0"></div>
<div class="slot" id="slot1"></div>
<div class="slot next" id="slot2"></div>
</div>
<div id="done" class="hidden">終点です<div><small>「最初から」で再スタート</small></div></div>
<footer><button id="back">← 戻る</button><button id="reset">最初から</button></footer>
</div>
<script>
const stops = ['グリーンタウン高尾', 'タウン北', 'タウン中央', 'タウン入口', '霊園正門', '霊園正門前、八王子城跡入口', '宮の前', '霞ヶ丘住宅', '高尾駅北口'];
let index=0;
function render(){
  const values=[stops[index+2]||"",stops[index+1]||"",stops[index]||""];
  document.getElementById("progress").textContent=index<stops.length?`${index+1} / ${stops.length}`:"完了";
  const route=document.getElementById("route"), done=document.getElementById("done");
  if(index>=stops.length){route.classList.add("hidden");done.classList.remove("hidden");return}
  route.classList.remove("hidden");done.classList.add("hidden");
  ["slot0","slot1","slot2"].forEach((id,i)=>{
    const el=document.getElementById(id);
    el.textContent=values[i];
    el.classList.toggle("empty",!values[i]);
  });
}
document.getElementById("tap").addEventListener("click",()=>{
  if(index<stops.length){index++;render();if(navigator.vibrate)navigator.vibrate(12)}
});
document.getElementById("back").addEventListener("click",e=>{
  e.stopPropagation();if(index>0){index--;render()}
});
document.getElementById("reset").addEventListener("click",e=>{
  e.stopPropagation();index=0;render()
});
render();
</script>
</body>
</html>
