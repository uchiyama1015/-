*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;touch-action:manipulation}
.screen{position:fixed;inset:0;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.hidden{display:none!important}
h1{font-size:28px;text-align:center;margin:10px 0 18px}
#routeList{overflow:auto;display:flex;flex-direction:column;gap:10px}
.routeBtn{width:100%;padding:17px 14px;border:1px solid #555;border-radius:14px;background:#1d1d1d;color:#fff;font-size:20px;font-weight:700;text-align:left}
#routeTitle{font-size:clamp(27px,7vw,40px);font-weight:800;text-align:center;line-height:1.3}
#progress{text-align:center;font-size:14px;opacity:.55;padding:3px 0 8px}
#route{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.slot{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 12px;border:1px solid #444;border-radius:16px;background:#1b1b1b;font-size:clamp(23px,6vw,34px);font-weight:700;line-height:1.25}
.slot.next{background:#f4edcf;color:#171717;border:2px solid #d8cfa9;font-size:clamp(28px,7.5vw,44px);font-weight:800}
.slot.empty{visibility:hidden}
#controls{display:flex;gap:8px;padding-top:10px}
button{border:0;border-radius:11px;padding:11px 8px;font-size:15px;background:#333;color:#fff}
#backTitle,#backSelect{flex:1}
#done{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:34px;font-weight:800}
#done small{display:block;margin-top:10px;font-size:15px;opacity:.6;font-weight:400}

let current=0,index=0;
const selectScreen=document.getElementById("selectScreen");
const titleScreen=document.getElementById("titleScreen");
const routeScreen=document.getElementById("routeScreen");
const routeList=document.getElementById("routeList");

routes.forEach((r,n)=>{
 const b=document.createElement("button");
 b.className="routeBtn";
 b.textContent=r.title;
 b.onclick=()=>{
   current=n; index=0;
   document.getElementById("routeTitle").textContent=r.title;
   selectScreen.classList.add("hidden");
   titleScreen.classList.remove("hidden");
 };
 routeList.appendChild(b);
});

titleScreen.onclick=()=>{
 titleScreen.classList.add("hidden");
 routeScreen.classList.remove("hidden");
 render();
};

function render(){
 const s=routes[current].stops;
 document.getElementById("progress").textContent=(index<s.length?index+1:s.length)+" / "+s.length;
 if(index>=s.length){
   document.getElementById("route").classList.add("hidden");
   document.getElementById("done").classList.remove("hidden");
   return;
 }
 document.getElementById("route").classList.remove("hidden");
 document.getElementById("done").classList.add("hidden");
 [index+2,index+1,index].forEach((v,k)=>{
   const e=document.getElementById("s"+k);
   e.textContent=s[v]||"";
   e.classList.toggle("empty",!s[v]);
 });
}

routeScreen.onclick=e=>{
 if(e.target.closest("button")) return;
 if(index<routes[current].stops.length){
   index++;
   render();
   if(navigator.vibrate) navigator.vibrate(12);
 }
};

document.getElementById("backTitle").onclick=e=>{
 e.stopPropagation(); index=0;
 routeScreen.classList.add("hidden");
 titleScreen.classList.remove("hidden");
};

document.getElementById("backSelect").onclick=e=>{
 e.stopPropagation(); index=0;
 routeScreen.classList.add("hidden");
 titleScreen.classList.add("hidden");
 selectScreen.classList.remove("hidden");
};
