<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>バス停暗記</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;touch-action:manipulation}.screen{position:fixed;inset:0;padding:12px;display:flex;flex-direction:column}.hidden{display:none!important}#title{align-items:center;justify-content:center;text-align:center}.title{font-size:clamp(28px,7vw,42px);font-weight:800}#route{flex:1;display:flex;flex-direction:column;gap:10px}.slot{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #444;border-radius:16px;background:#1b1b1b;padding:8px;font-size:clamp(23px,6vw,34px);font-weight:700}.next{background:#f4edcf!important;color:#171717!important;border:2px solid #d8cfa9!important;font-size:clamp(28px,7.5vw,44px)!important}.empty{visibility:hidden}#progress{text-align:center;opacity:.55;padding:5px}#controls{text-align:center;padding-top:10px}button{background:#333;color:#fff;border:0;border-radius:11px;padding:10px 16px;font-size:15px}#done{flex:1;align-items:center;justify-content:center;text-align:center;font-size:34px;font-weight:800}small{display:block;font-size:15px;opacity:.6;margin-top:10px}</style></head><body><div id="title" class="screen"><div class="title">グリーンタウン高尾→高尾駅北口</div></div><div id="main" class="screen hidden"><div id="progress"></div><div id="route"><div class="slot" id="a"></div><div class="slot" id="b"></div><div class="slot next" id="c"></div></div><div id="done" class="hidden"><div>終点です<small>「最初に戻る」でタイトル画面へ</small></div></div><div id="controls"><button id="back">最初に戻る</button></div></div><script>const s=["グリーンタウン高尾","タウン北","タウン中央","タウン入口","霊園正門","霊園正門前、八王子城跡入口","宮の前","霞ヶ丘住宅","高尾駅北口"];let i=0;const t=document.getElementById('title'),m=document.getElementById('main'),r=document.getElementById('route'),d=document.getElementById('done');function draw(){document.getElementById('progress').textContent=i<s.length?`${i+1} / ${s.length}`:'完了';if(i>=s.length){r.classList.add('hidden');d.classList.remove('hidden');return}r.classList.remove('hidden');d.classList.add('hidden');[i+2,i+1,i].forEach((n,k)=>{let e=document.getElementById(['a','b','c'][k]);e.textContent=s[n]||'';e.classList.toggle('empty',!s[n])})}t.onclick=()=>{i=0;t.classList.add('hidden');m.classList.remove('hidden');draw()};m.onclick=e=>{if(e.target.closest('button'))return;if(!r.classList.contains('hidden')){i++;draw();if(navigator.vibrate)navigator.vibrate(12)}};document.getElementById('back').onclick=e=>{e.stopPropagation();i=0;m.classList.add('hidden');t.classList.remove('hidden')};</script></body></html>
