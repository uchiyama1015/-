<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>バス停進行表示</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
    background:#111;
    color:#fff;
    touch-action: manipulation;
  }
  #app {
    height:100dvh;
    display:flex;
    flex-direction:column;
    padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
  }
  header {
    flex:0 0 auto;
    text-align:center;
    font-size:15px;
    opacity:.7;
    padding:6px 0 10px;
  }
  #stops {
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    gap:8px;
    min-height:0;
    overflow:hidden;
  }
  .stop {
    min-height:0;
    flex:1 1 0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    border:1px solid #444;
    border-radius:14px;
    background:#1d1d1d;
    padding:8px 12px;
    font-size:clamp(18px, 5vw, 30px);
    font-weight:700;
    line-height:1.25;
  }
  .next {
    background:#292929;
  }
  .next::before {
    content:"次";
    position:absolute;
    margin-top:-58px;
    font-size:12px;
    opacity:.55;
    font-weight:500;
  }
  #tap {
    position:fixed;
    inset:0;
    z-index:0;
  }
  #app > * { position:relative; z-index:1; pointer-events:none; }
  button {
    pointer-events:auto;
    border:0;
    border-radius:12px;
    padding:9px 14px;
    font-size:14px;
    background:#333;
    color:#fff;
  }
  footer {
    flex:0 0 auto;
    display:flex;
    justify-content:center;
    gap:8px;
    padding-top:10px;
  }
  .hidden { display:none; }
  #done {
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:32px;
    font-weight:700;
  }
  small { display:block; margin-top:10px; font-size:15px; opacity:.65; font-weight:400; }
</style>
</head>
<body>
<div id="tap"></div>
<div id="app">
  <header id="progress"></header>
  <div id="stops"></div>
  <div id="done" class="hidden">終点です<small>リセットで最初から</small></div>
  <footer>
    <button id="back">← 戻る</button>
    <button id="reset">最初から</button>
  </footer>
</div>

<script>
const originalStops = [
  "グリーンタウン高尾",
  "タウン北",
  "タウン中央",
  "タウン入口",
  "霊園正門",
  "霊園正門前、八王子城跡入口",
  "宮の前",
  "霞ヶ丘住宅",
  "高尾駅北口"
];

let index = 0;

function render() {
  const remaining = originalStops.slice(index);
  const stops = document.getElementById("stops");
  const done = document.getElementById("done");
  stops.innerHTML = "";
  document.getElementById("progress").textContent =
    index < originalStops.length ? `${index + 1} / ${originalStops.length}` : "完了";

  if (remaining.length === 0) {
    stops.classList.add("hidden");
    done.classList.remove("hidden");
    return;
  }

  stops.classList.remove("hidden");
  done.classList.add("hidden");

  remaining.forEach((name, i) => {
    const div = document.createElement("div");
    div.className = "stop" + (i === 0 ? " next" : "");
    div.textContent = name;
    stops.appendChild(div);
  });
}

document.getElementById("tap").addEventListener("click", () => {
  if (index < originalStops.length) {
    index++;
    render();
    if (navigator.vibrate) navigator.vibrate(15);
  }
});

document.getElementById("back").addEventListener("click", (e) => {
  e.stopPropagation();
  if (index > 0) { index--; render(); }
});

document.getElementById("reset").addEventListener("click", (e) => {
  e.stopPropagation();
  index = 0;
  render();
});

render();
</script>
</body>
</html>
